[workspace]
resolver = "2"
members = [
    "crates/wyrd-cli",
    "crates/wyrd-core",
    "crates/wyrd-corpus",
    "crates/wyrd-eval",
    "crates/wyrd-graph",
    "crates/wyrd-providers",
    "crates/wyrd-publish",
    "crates/wyrd-retrieve",
]

[workspace.package]
edition = "2021"
# Licence intentionally unset. Charter section 12, decision 2 is still open.

[profile.dev]
# This box is small. Keep dev builds light.
debug = 1
