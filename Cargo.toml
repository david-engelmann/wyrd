[workspace]
resolver = "2"
members = [
    "crates/wyrd-cli",
    "crates/wyrd-core",
    "crates/wyrd-corpus",
    "crates/wyrd-eval",
    "crates/wyrd-graph",
    "crates/wyrd-providers",
    "crates/wyrd-publish",
    "crates/wyrd-retrieve",
    "crates/wyrd-train",
]

[workspace.package]
edition = "2021"
# Licence decided 2026-11-05 (charter section 12, decision 2):
# Apache-2.0 for code, CC BY 4.0 for data wyrd holds rights to.
license = "Apache-2.0"

[profile.dev]
# This box is small. Keep dev builds light.
debug = 1
